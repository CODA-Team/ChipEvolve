schema_version: 1
purpose: >
  Human and agent-facing inventory of tracked patch artifacts.  Files listed
  here are the only tracked patch/delta artifacts that should be considered in
  normal work.  Retired local archives are not repo dependencies and are not
  default context.

prepare_patches:
  - path: patches/openroad_dpl_evolve_base.patch
    status: active_prepare_patch
    meaning: >
      Bootstraps the clean dpl_evolve source and command registration onto the
      recorded OpenROAD anchor.
      Target-side README documentation is intentionally excluded from this
      patch; the control repo README/AGENTS/knowledge files are the canonical
      human and agent-facing instructions.  prepare_workspace.sh snapshots
      this state as seed_sources/diamond_dpl_evolve before applying the
      framework patch.
    apply_target: clean OpenROAD anchor from metadata/anchors.json

  - path: patches/openroad_dpl_evolve_framework.patch
    status: active_prepare_patch
    meaning: >
      Adds the constrained EvolveLegalizer top-level framework, student-owned
      algorithm hook, telemetry, LEGALM-style guidance/legalization, and
      Abacus-enabled negotiation repair on top of the clean dpl_evolve base.
      Baseline collection is handled by the control repo, and child agents
      modify a private variant implementation after reading source references
      and measured case evidence.  prepare_workspace.sh snapshots this state
      as seed_sources/framework_dpl_evolve.
    apply_target: prepared OpenROAD after openroad_dpl_evolve_base.patch
    verification: framework_smoke_passed

  - path: patches/orfs_make_overlay.patch
    status: active_prepare_patch
    meaning: >
      Small ORFS Makefile runner hook used by strict baseline wrappers.
    apply_target: recorded ORFS anchor from metadata/anchors.json

reference_deltas:
  - path: family_variants/openroad_negotiation_nblg/mechanism_deltas/parallel_frontier.diff
    status: archived_delta_reference
    meaning: >
      Compact negotiation donor delta for safe threading, two-pass frontier,
      and candidate telemetry ideas.
    apply_policy: >
      Do not apply directly to the current constrained framework.  Port
      selected mechanisms into the private variant's EvolveLegalizer/student
      algorithm implementation.

evolved_legalizer_patches:
  - path: patches/evolved_legalizers/openroad_dpl_evolve_legalm_iter30_from_clean.patch
    status: active_evolved_candidate_patch
    source_commit: 7f71b2f
    source_tag: candidate/legalm_20iter_001_iter_30_final_target_release_probes
    meaning: >
      Standalone clean-anchor OpenROAD patch preserving the final LEGALM/global
      differential legalization-only evolve line.
    apply_target: clean OpenROAD anchor from metadata/anchors.json
    verification: git_apply_check_ok

  - path: patches/evolved_legalizers/openroad_dpl_evolve_negotiation_iter30_from_clean.patch
    status: active_evolved_candidate_patch
    source_commit: 52f3b85
    source_tag: negotiation_20iter_001_iter_29 and negotiation_20iter_001_iter_30
    meaning: >
      Standalone clean-anchor OpenROAD patch preserving the final NBLG /
      negotiation legalization-only evolve line.
    apply_target: clean OpenROAD anchor from metadata/anchors.json
    verification: git_apply_check_ok

  - path: patches/evolved_legalizers/openroad_dpl_evolve_diamond_iter30_from_clean.patch
    status: active_evolved_candidate_patch
    source_commit: c4d758a
    source_tag: diamond_20iter_001_iter_30
    meaning: >
      Standalone clean-anchor OpenROAD patch preserving the final Diamond /
      local-greedy legalization-only evolve line.
    apply_target: clean OpenROAD anchor from metadata/anchors.json
    verification: git_apply_check_ok

  - path: patches/evolved_legalizers/openroad_dpl_evolve_legalm_iter30_framework_delta.patch
    status: active_review_delta
    source_commit: 7f71b2f
    meaning: >
      Review-sized delta from the prepared dpl_evolve framework to the final
      LEGALM/global differential line.
    apply_target: prepared OpenROAD after base and framework patches
    verification: git_apply_check_ok

  - path: patches/evolved_legalizers/openroad_dpl_evolve_negotiation_iter30_framework_delta.patch
    status: active_review_delta
    source_commit: 52f3b85
    meaning: >
      Review-sized delta from the prepared dpl_evolve framework to the final
      NBLG / negotiation line.
    apply_target: prepared OpenROAD after base and framework patches
    verification: git_apply_check_ok

  - path: patches/evolved_legalizers/openroad_dpl_evolve_diamond_iter30_framework_delta.patch
    status: active_review_delta
    source_commit: c4d758a
    meaning: >
      Review-sized delta from the prepared dpl_evolve framework to the final
      Diamond / local-greedy line.
    apply_target: prepared OpenROAD after base and framework patches
    verification: git_apply_check_ok

evolved_dpo_patches:
  - path: patches/evolved_dpo/src_dpo_neg014_hybrid_quality.patch
    status: active_improve_placement_donor
    source_tag: neg014_hybrid_quality
    meaning: >
      Source-root DPO/improve-placement quality-ceiling donor.  Apply inside a
      private dpl_evolve source tree or use a prepared local
      start/<legalizer>_dpo_neg014 branch.
    apply_target: private dpl_evolve source root after framework or evolved legalizer seed
    verification: git_apply_check_ok_with_whitespace_warnings

  - path: patches/evolved_dpo/src_dpo_neg015_staged_runtime.patch
    status: active_improve_placement_donor
    source_tag: neg015_staged_runtime
    meaning: >
      Source-root staged-fallback runtime donor for DPO/improve placement.
    apply_target: private dpl_evolve source root after framework or evolved legalizer seed
    verification: git_apply_check_ok_with_whitespace_warnings

  - path: patches/evolved_dpo/src_dpo_neg017b_algo1_src_cache_runtime.patch
    status: active_improve_placement_donor
    source_tag: neg017b_algo1_src_cache_runtime
    meaning: >
      Recommended source-root DPO donor balancing final HPWL quality and
      runtime through cached source-edge Algorithm-1 scoring.
    apply_target: private dpl_evolve source root after framework or evolved legalizer seed
    verification: git_apply_check_ok_with_whitespace_warnings

  - path: patches/evolved_dpo/src_dpo_neg014_to_neg015_runtime_delta.patch
    status: active_review_delta
    source_tag: neg014_to_neg015_runtime_delta
    meaning: >
      Source-root review delta from the quality donor toward the staged-runtime
      donor. Use as mechanism evidence or for an intentional runtime repair.
    apply_target: private dpl_evolve source root after src_dpo_neg014_hybrid_quality.patch
    verification: git_apply_check_ok_with_whitespace_warnings

  - path: patches/evolved_dpo/src_dpo_neg015_to_neg017b_algo1_cache_delta.patch
    status: active_review_delta
    source_tag: neg015_to_neg017b_algo1_cache_delta
    meaning: >
      Source-root review delta that adds cached/parallel Algorithm-1 scoring on
      top of the staged-runtime donor.
    apply_target: private dpl_evolve source root after src_dpo_neg015_staged_runtime.patch
    verification: git_apply_check_ok_with_whitespace_warnings
