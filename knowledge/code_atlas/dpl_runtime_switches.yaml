public_master_runtime_switches:
  detailed_placement_flags:
    - "-use_negotiation"
    - "-abacus"
    - "-incremental"
    - "-max_displacement"
  improve_placement_flags:
    - "-max_displacement"
    - "-global_swap_args"
    - "-enable_extra_dpl"
  flow_envs_seen_in_detail_place:
    - "BALANCE_ROWS"
    - "CELL_PAD_IN_SITES_DETAIL_PLACEMENT"
    - "DETAIL_PLACEMENT_ARGS"
    - "USE_NEGOTIATION"
    - "ENABLE_DPO"
    - "DPO_MAX_DISPLACEMENT"
important_note: >
  `-abacus` is only meaningful when `-use_negotiation` is also enabled.
