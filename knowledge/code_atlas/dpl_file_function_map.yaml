files:
  "src/dpl_evolve/src/Opendp.tcl":
    owns:
      - "detailed_placement Tcl interface"
      - "improve_placement Tcl interface"
      - "optimize_mirroring Tcl interface"
      - "debug helper Tcl commands"
    edit_risk: "low-to-medium"
    use_when:
      - "adding or exposing a new runtime knob"
      - "threading a new parameter to C++"
  "src/dpl_evolve/src/Opendp.cpp":
    owns:
      - "top-level detailed placement dispatch"
      - "engine selection: diamond vs negotiation"
      - "default displacement policy"
      - "DB import/export around placement"
    edit_risk: "medium"
    use_when:
      - "changing engine selection logic"
      - "changing default legalizer policy and high-level sequencing"
  "src/dpl_evolve/src/NegotiationLegalizer.cpp":
    owns:
      - "negotiation legalizer implementation"
      - "abacus pre-pass / negotiation pass / post-neg sync"
      - "metrics collection and flush"
    edit_risk: "medium-to-high"
    use_when:
      - "changing cost, search, history, refinement, disabled postopt recovery"
  "src/dpl_evolve/src/Optdp.cpp":
    owns:
      - "improvePlacement / DPO"
    edit_risk: "high for current phase"
    use_when:
      - "only after strict legalizer phase is stable"
priority_patch_order:
  - "NegotiationLegalizer.cpp"
  - "Opendp.cpp"
  - "Opendp.tcl"
read_before_edit:
  - "detail_place_stack.yaml"
  - "nblg_to_openroad.yaml"
  - "legalm_to_openroad.yaml"
