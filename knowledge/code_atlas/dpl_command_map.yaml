commands:
  detailed_placement:
    public_wrapper: "src/dpl_evolve/src/Opendp.tcl"
    underlying_cmd: "dpl::detailed_placement_cmd"
    primary_cpp_entry: "Opendp::detailedPlacement"
    important_flags:
      - "-use_negotiation"
      - "-abacus"
      - "-incremental"
      - "-max_displacement"
      - "-report_file_name"
    role: "Main legalizer entry point."
  improve_placement:
    public_wrapper: "src/dpl_evolve/src/Opendp.tcl"
    underlying_cmd: "dpl::improve_placement_cmd"
    likely_cpp_entry: "Opendp::improvePlacement"
    role: "DPO / post-legalizer optimization, not part of strict legalizer claims."
    important_flags:
      - "-random_seed"
      - "-max_displacement"
      - "-global_swap_args"
      - "-enable_extra_dpl"
  optimize_mirroring:
    public_wrapper: "src/dpl_evolve/src/Opendp.tcl"
    role: "Weak HPWL reduction pass after legalization; keep out of strict legalizer claims."
  check_placement:
    public_wrapper: "src/dpl_evolve/src/Opendp.tcl"
    role: "Legality oracle."
  set_placement_padding:
    public_wrapper: "src/dpl_evolve/src/Opendp.tcl"
    role: "Pre-legalization padding / row-space conditioning."
developer_debug_helpers:
  - "detailed_placement_debug"
  - "get_inst_bbox"
  - "get_inst_grid_bbox"
  - "format_grid"
  - "get_row_site"
