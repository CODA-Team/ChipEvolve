id: priority_escape
status: promising
summary: >
  Prioritize highly connected, high-displacement cells earlier in negotiation
  and give them an expanded escape candidate generation path when the standard
  local windows are not enough.
source_surfaces:
  - "tools/OpenROAD/src/dpl_evolve/src/NegotiationLegalizer.h"
  - "tools/OpenROAD/src/dpl_evolve/src/NegotiationLegalizerPass.cpp"
mechanisms:
  - "critical-first negotiation ordering"
  - "deduplicated candidate visitation"
  - "coarse escape-window exploration for critical cells"
  - "diamond-search candidate seeding inside main-pass findBestLocation"
helps:
  - "large-case stuck-cell escape"
  - "main-pass quality without relying only on postopt"
  - "can complement localized_swap and selective_refinement"
risks:
  - "extra main-pass search can increase runtime if critical-cell gating is too broad"
  - "diamond escape may recover legality but not necessarily timing unless paired with a stronger objective"
stacks_well_with:
  - "netaware_objective"
  - "selective_refinement"
  - "localized_swap"
best_use:
  - "larger cases where localized_swap improves HPWL but timing still lags"
  - "cases showing stuck-cell or no-valid-candidate behavior during negotiation"
current_note:
  - "validated on ariane133_nangate45 as a promising stack on top of localized_swap"
  - "improved HPWL, setup WNS, and setup TNS together, with a small runtime increase"
  - "on jpeg_nangate45 it preserved an HPWL gain and controlled runtime versus the older heavy family, but setup timing regressed"
