id: netaware_objective
status: reusable
summary: >
  Blend displacement / max-displacement cost with a local HPWL proxy so both
  negotiation and postopt prefer lower local wirelength when legality allows it.
source_surfaces:
  - "tools/OpenROAD/src/dpl_evolve/src/NegotiationLegalizer.h"
  - "tools/OpenROAD/src/dpl_evolve/src/NegotiationLegalizerPass.cpp"
mechanisms:
  - "placementObjective"
  - "wirelengthDeltaCost"
  - "objective-based cellSwap acceptance"
helps:
  - "HPWL"
  - "sometimes setup WNS/TNS when nets are shortened"
risks:
  - "runtime increase if every candidate pays a large objective cost"
  - "can pull cells too far if not paired with runtime-aware refinement"
stacks_well_with:
  - "selective_refinement_budget"
  - "localized_swap"
  - "smooth_anchor_objective"
avoid_without:
  - "runtime-aware postopt policy on larger cases"

