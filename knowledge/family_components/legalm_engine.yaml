id: legalm_engine
status: reusable_variant_base
summary: >
  CPU-first LEGALM-style legalizer packaged as a family-specific `dpl_evolve`
  variant over the clean initial evolve base. Preserves the Stage1/Stage2/Stage3
  scaffold and keeps the implementation separate from the negotiation path.
variant_assets:
  - "evolve_agent/family_variants/legalm_engine/manifest.yaml"
  - "evolve_agent/family_variants/legalm_engine/dpl_evolve.patch"
materialize_with:
  - "evolve_agent/scripts/materialize_family_variant.sh --family legalm_engine --output-dir ./.codex_state/family_variants/legalm_engine/dpl_evolve --force"
source_surfaces:
  - "materialized dpl_evolve/src/AlmLegalizer.h"
  - "materialized dpl_evolve/src/AlmLegalizer.cpp"
  - "materialized dpl_evolve/src/AlmPartitioner.h"
  - "materialized dpl_evolve/src/AlmPartitioner.cpp"
  - "materialized dpl_evolve/src/AlmPlates.h"
  - "materialized dpl_evolve/src/AlmPlates.cpp"
  - "materialized dpl_evolve/include/dpl_evolve/Opendp.h"
  - "materialized dpl_evolve/src/Opendp.cpp"
  - "materialized dpl_evolve/src/Opendp.i"
  - "materialized dpl_evolve/src/Opendp.tcl"
  - "evolve_agent/baseline/detail_place_only_evolve_legalm.tcl"
  - "evolve_agent/baseline/flow/detail_place_flow_evolve_legalm.tcl"
mechanisms:
  - "Stage1 scanline-based initial legalization"
  - "Stage2 ALM-based legalization with BGD, multiplier update, partition refresh, and local optimum escape"
  - "Stage3 local refinement"
  - "runtime-selectable third legalizer engine dispatch in Opendp"
helps:
  - "establish a separate legalizer base that evolves independently of negotiation"
  - "preserve LEGALM-style structure while reusing OpenDP legality and region machinery"
  - "provide an alternative initializer / base engine for medium-case regimes"
risks:
  - "larger-case quality/runtime regime still needs mapping"
  - "candidate stencil is intentionally scaffolded rather than paper-perfect"
stacks_well_with:
  - "future LEGALM-specific objective families"
  - "future LEGALM stuck-cell escape refinements"
  - "future LEGALM runtime-control families"
best_use:
  - "when an alternative to negotiation is desired as the initial legalizer base"
  - "when evolving Stage1/Stage2/Stage3 behavior directly is more appropriate than patching negotiation"
requirements:
  - "materialize the family into an external dpl_evolve source tree"
  - "configure and build a dedicated OpenROAD variant binary"
current_note:
  - "gcd_nangate45 strict smoke passed end-to-end on the evolve line with the legalm_engine variant binary"
  - "medium-case runtime is near baseline on ibex_nangate45 and below baseline on aes_nangate45"
  - "use this as a variant initializer, not as a main-tree mutation surface"
