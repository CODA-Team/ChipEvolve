version: 1
goal: >
  Introduce small, reviewable evolve seams inside dpl_evolve so Codex can mutate
  bounded mechanisms instead of editing large monolithic functions.
recommended_seams:
  - seam: compute_target_cost
    intended_home: NegotiationLegalizer.cpp
    aligns_with:
      - nblg.cost.target_cost
      - legalm2.displacement_cost
    purpose: "Isolate displacement/max-displacement related scoring."
    expected_modes:
      - param_tuning
      - formula_change
  - seam: compute_congestion_penalty
    intended_home: NegotiationLegalizer.cpp
    aligns_with:
      - nblg.adaptive_penalty
      - legalm2.overflow_weighting
    purpose: "Isolate overflow/history/penalty logic."
    expected_modes:
      - param_tuning
      - formula_change
  - seam: build_search_window
    intended_home: NegotiationLegalizer.cpp
    aligns_with:
      - nblg.surrounding_window
      - legalm2.local_region_search
    purpose: "Centralize candidate enumeration policy."
    expected_modes:
      - search_window_policy_change
  - seam: order_illegal_cells
    intended_home: NegotiationLegalizer.cpp
    aligns_with:
      - nblg.negotiation_order
    purpose: "Centralize processing order policy for congested/illegal cells."
    expected_modes:
      - ordering_logic_change
  - seam: should_skip_cell_by_isolation
    intended_home: NegotiationLegalizer.cpp
    aligns_with:
      - nblg.isolation_point
    purpose: "Gate relocation of currently noncongested cells in later iterations."
    expected_modes:
      - isolation_logic_change
  - seam: run_post_legalization_refine
    intended_home: NegotiationLegalizer.cpp
    aligns_with:
      - nblg.postoptimization
      - legalm2.zero_overflow_refinement
    purpose: "Bounded refinement hook after overlap-free solution."
    expected_modes:
      - gate_enable_disable
      - bounded_refinement_change
adoption_policy:
  - "Prefer extracting one seam at a time."
  - "Every seam extraction must be behavior-preserving before mutation."
  - "Do not mix seam extraction and aggressive algorithm changes in the same patch."
