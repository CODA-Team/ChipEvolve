family: initialization_refinement_family
when_to_use:
  - "legalizer is stable but clearly leaves quality on the table"
  - "strict-track HPWL and displacement both suggest poor start positions or weak refinement"
mechanisms:
  - name: "nearest-legal seeding / scanline-inspired init"
    donor: "LEGALM 2.0"
    target_surfaces:
      - "Opendp.cpp"
      - "NegotiationLegalizer.cpp"
    expected_effect:
      - "fewer bad early moves"
      - "less later perturbation"
  - name: "post-negotiation no-overflow refinement"
    donor: "LEGALM 2.0 + NBLG postopt"
    target_surfaces:
      - "NegotiationLegalizer.cpp"
    expected_effect:
      - "lower displacement / HPWL after legality"
    risks:
      - "runtime increase"
      - "if coded incorrectly, latent legality regressions"
hard_gates:
  - "legality must remain true after refinement"
  - "runtime budget respected"
