schema_version: 1
purpose: >
  Compact agent-facing cards for choosing and evolving base families.  These
  cards are the first read for a bounded patch turn; long replay logs and
  runtime artifacts are evidence, not default context.

global_contract:
  command_path: "detailed_placement_evolve -use_negotiation"
  implementation_scope: "private dpl_evolve variant source generated by dpl_evolve_agent"
  current_phase: >
    Base-family hardening.  Do not promote broad algobank composites,
    self-evolving prompt ideas, fallback behavior, build-only variants, or
    small-case-only wins.  Use those artifacts as evidence, then isolate a
    clean scale-safe algorithm.
  evidence_to_read:
    - "knowledge/algorithm_cards/algobank50_findings_20260425.yaml"
  forbidden_base_proof:
    - fallback_to_diamond_as_normal_large_case_behavior
    - fallback_to_default_dpl_as_normal_large_case_behavior
    - optimizing_only_aes_or_other_small_cases
    - full_grid_scans_without_complexity_bounds
    - full_pair_postopt_enumeration_on_large_groups
  promotion_rule:
    - "Small cases are smoke tests, not the base-family objective."
    - "A robust base must have a scale-safe algorithmic path for jpeg/ariane/bp_quad-class cases."
    - "Diagnostic fallback may prove plumbing, but it does not prove family scalability."
    - "A legal result that materially worsens HPWL/runtime/displacement versus the same-run baseline is not promotion-quality."
    - "Base-family work should tune real algorithms first; algobank mixtures are not base implementations until their mechanism is isolated."

base_families:
  - id: negotiation_row_bucket_active_set
    status: scale_safe_candidate
    startpoint: clean_evolve_base
    primary_symbols:
      - NegotiationLegalizer::runNegotiation
      - NegotiationLegalizer::findBestLocation
    mechanism:
      - Replace illegal-seed by all-cell neighbor expansion with row-local spatial buckets.
      - Keep all variants on the same negotiation/evolve command path.
      - Use bounded candidate sampling only as a large-design complexity control.
    use_when:
      - bp_quad_or_large_case_timeout
      - high_illegal_seed_count
      - active_set_growth_dominates_runtime
    evolve_next:
      - dirty_region_bystander_scan
      - component_local_frontier_growth
      - no_valid_candidate_telemetry
      - candidate_cap_with_anchor_probes
    avoid:
      - routing_large_cases_to_diamond
      - deleting legality rechecks
      - broad small_case_only window tuning

  - id: negotiation_row_bucket_quality_guard
    status: repair_candidate
    startpoint: negotiation_row_bucket_active_set
    primary_symbols:
      - NegotiationLegalizer::findBestLocation
      - NegotiationLegalizer::runNegotiation
    mechanism:
      - Preserve row-bucket active-set growth while adding a local net-anchor quality proxy.
      - Penalize moves away from connected-neighbor anchors and displacement outliers.
      - Remove active fallback-to-diamond behavior from the tested path.
    evidence:
      - "R4 strict aes/jpeg legal; HPWL improved 45.11% and 29.55% versus same-run baselines."
      - "Runtime is too high for promotion: jpeg is 8.32% slower than same-run baseline and 31.6% slower than the previous active-set variant."
    evolve_next:
      - apply_quality_proxy_only_to_short_frontier
      - margin_based_shortlist_after_cheap_score
      - preserve_row_bucket_runtime_advantage
    avoid:
      - applying_net_anchor_proxy_to_full_candidate_window
      - trading_away_large_case_runtime_for_small_case_quality

  - id: negotiation_row_bucket_quality_frontier_r5
    status: aes_jpeg_candidate_needs_large_gate
    startpoint: negotiation_row_bucket_quality_guard
    primary_symbols:
      - NegotiationLegalizer::findBestLocation
    mechanism:
      - Keep the local net-anchor quality proxy from R4.
      - Apply the quality proxy only to a bounded cheap-score frontier.
      - Preserve row-bucket active-set runtime behavior and avoid fallback paths.
    evidence:
      - "R5 strict aes legal: HPWL -6.09% and runtime -8.99% versus same-run baseline."
      - "R5 strict jpeg legal: HPWL -1.92% and runtime -24.66% versus same-run baseline."
    patch_artifact:
      - "family_variants/negotiation_row_bucket_quality_frontier_r5/research_patches/negotiation_row_bucket_quality_frontier_r5.patch"
    flow_artifact:
      - "family_variants/negotiation_row_bucket_quality_frontier_r5/manifest.yaml"
    matrix_variant:
      - "negotiation_row_bucket_quality_frontier_r5"
    evolve_next:
      - large_case_gate_bp_quad_or_ariane
      - preserve_frontier_runtime
      - avoid_small_case_retuning_before_large_gate
    avoid:
      - broadening_frontier_before_bp_gate
      - optimizing_aes_at_the_cost_of_jpeg_or_bp

  - id: netaware02_history_sqrt_anchor
    status: safe_light_base
    startpoint: clean_or_runtime_aware_negotiation
    primary_symbols:
      - NegotiationLegalizer::targetCost
      - NegotiationLegalizer::negotiationCost
      - NegotiationLegalizer::findBestLocation
      - NegotiationLegalizer::sortByNegotiationOrder
    mechanism:
      - Blend current and initial anchors.
      - Use softened congestion/history shaping.
      - Add midpoint-style candidate information without heavy postopt.
    use_when:
      - legal_result_but_hpwl_or_timing_proxy_is_weak
      - jpeg_class_quality_needs_improvement_under_runtime_guard
    evolve_next:
      - current_blend_history_runtime_trim_row_edge_probe
      - soft_threshold_overflow_only_row_edge_probe_for_jpeg_quality
      - real_net_degree_or_endpoint_cost
      - local_hpwl_delta_cache
      - timing_proxy_hotset
    avoid:
      - pretending constant weight tuning is an algorithmic patch
      - promoting quality-biased variants that time out on bp_quad

  - id: netaware12_prefilter_hotset_guard
    status: repair_candidate
    startpoint: netaware11_local_hpwl_anchor_cap
    primary_symbols:
      - NegotiationLegalizer::findBestLocation
      - NegotiationLegalizer::negotiationCost
      - NegotiationLegalizer::localHpwlDeltaCost
    mechanism:
      - Keep the net-aware HPWL/timing idea but evaluate expensive local HPWL only on a bounded shortlist.
      - Restrict net-aware scoring to low/medium fanout, displacement-hot, or late-unsettled cells.
      - Make midpoint/connectivity-anchor probes fallback-only.
    evidence:
      - "R4 strict aes/jpeg/ariane legal; HPWL improved by 2.07%, 6.47%, and 4.58% versus same-run baselines."
      - "Runtime overhead is still about 18-20%, so this is not a hard base yet."
      - "R5 quality-recover attempt improved jpeg HPWL further but failed evidence gates because AES runtime and JPEG max displacement regressed; keep R4 as the cleaner repair candidate."
    patch_artifact:
      - "family_variants/netaware_objective/research_patches/netaware12_prefilter_hotset_guard.patch"
    evolve_next:
      - recover_more_hpwl_inside_shortlist
      - cache_or_prefilter_local_hpwl_terms
      - reduce_runtime_without_removing_netaware_signal
    avoid:
      - restoring_full_per_candidate_net_traversal
      - accepting_jpeg_max_displacement_growth

  - id: legalm_base_bounded_stage1
    status: legality_repair_candidate_needs_quality_repair
    startpoint: materialized_legalm_engine
    primary_symbols:
      - AlmLegalizer::findNearestInitialCandidate
      - AlmLegalizer::stage2AlmLegalization
      - AlmLegalizer::stage3NetRefinement
    mechanism:
      - Materialize LEGALM as a separate dpl_evolve implementation behind the same evolve command.
      - Use bounded Stage1 recovery windows instead of full-core scans.
      - Use conservative displacement scoring and local refinement until scale gates pass.
      - R4 telemetry fixed a stale Stage1 maintained-overflow counter that caused DPL-1803 on aes.
    use_when:
      - need_structurally_different_initializer_or_repair_path
      - negotiation_family_repeatedly_times_out_or_gets_stuck
    evolve_next:
      - stage1_candidate_cost_quality_guard
      - plate_local_candidate_index
      - bounded_overflow_component_escape
      - stage3_hotset_refinement
      - per_stage_telemetry_and_budgeting
    avoid:
      - full_window_global_stage1_search_as_base
      - fallback_to_diamond_on_large_cases
      - optimizing_only_medium_cases
      - claiming_base_status_before_aes_legality
      - claiming_base_status_with_large_jpeg_displacement_or_hpwl_cost

  - id: legalm_stage1_quality_guard_r5
    status: legality_repair_lineage_not_base
    startpoint: legalm_base_bounded_stage1_counterfix
    primary_symbols:
      - AlmLegalizer::stage1InitialLegalization
      - AlmLegalizer::searchInitialWindowCandidate
    mechanism:
      - Preserve the R4 stale-overflow counter fix.
      - Add bounded Stage1 quality ordering inside the existing search window.
    evidence:
      - "R5 strict aes/jpeg legal through the same evolve command."
      - "JPEG remains much worse than clean evolve baseline on HPWL and displacement, so this is not a base."
    patch_artifact:
      - "family_variants/legalm_engine/research_patches/legalm_counterfix_r4.patch"
      - "family_variants/legalm_engine/research_patches/legalm_stage1_quality_guard_r5.patch"
    evolve_next:
      - rethink_stage1_quality_without_large_displacement
      - keep_counterfix_as_required_legality_patch
    avoid:
      - bp_gate_before_jpeg_quality_is_repaired
      - treating_legality_fix_as_algorithm_quality

  - id: localized_swap_bounded_polish
    status: followup_polish_not_base
    startpoint: legal_runtime_safe_parent
    primary_symbols:
      - NegotiationLegalizer::cellSwap
      - NegotiationLegalizer::legalize
    mechanism:
      - Bounded local post-legalization polish after a legal parent exists.
      - Hotset/bucket/cap/transactional rollback are required.
    use_when:
      - placement_is_legal
      - runtime_is_stable
      - residual_local_hpwl_or_displacement_polish_is_needed
    evolve_next:
      - netaware_swap_score
      - row_segment_reorder
      - timing_hotset_order
    avoid:
      - using_as_initial_base
      - full_pair_same_shape_swap_on_large_groups
      - claiming bp_quad robustness from aes_or_jpeg_smoke
      - broad_guarded_greedy_or_swap_greedy_postopt_without_hotset_limits

  - id: priority_escape_repair
    status: repair_target_not_base
    startpoint: runtime_safe_negotiation_parent
    primary_symbols:
      - NegotiationLegalizer::findBestLocation
      - NegotiationLegalizer::negotiationIter
      - NegotiationLegalizer::sortByNegotiationOrder
    mechanism:
      - Recover no-valid-candidate or stuck-cell behavior with bounded escape candidates.
      - Prioritize runtime and displacement guards before HPWL polish.
    use_when:
      - no_valid_candidate_events
      - repeated_stalls
      - late_convergence_or_current_location_returns
    evolve_next:
      - bounded_frontier_escape
      - rollback_safe_pair_or_chain_move
      - dirty_region_recheck
    avoid:
      - illegal_first_sort_that_calls_expensive_legality_checks_for_every_compare
      - row_edge_or_cardinal_probes_without_fallback_only_guards
      - HPWL_improvement_that_requires_runtime_explosion
      - stall_fast_or_broad_escape_on_normal_legal_cases
