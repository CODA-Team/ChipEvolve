    - "family_variants/legalm_engine/manifest.yaml"
    - "family_variants/legalm_engine/dpl_evolve.patch"
    - "family_robustness/legalm_engine/"
  primary_symbols:
    - "AlmLegalizer::stage1InitialLegalization"
    - "AlmLegalizer::searchInitialWindowCandidate"
    - "AlmLegalizer::stage2AlmLegalization"
    - "AlmLegalizer::stage3NetRefinement"
    - "AlmLegalizer::zeroOverflowRepair"
evidence:
  r4_counterfix:
    status: legality_repair_candidate
    result_note: "family_robustness/legalm_engine/NEXT_ALGORITHM_DIRECTION_20260425.md"
    patch_artifact: "family_variants/legalm_engine/research_patches/legalm_counterfix_r4.patch"
    observation:
      - "Fixed stale maintained-overflow state after Stage1 grid clear."
      - "Strict aes_nangate45 and jpeg_nangate45 legalize through LEGALM."
      - "jpeg_nangate45 remains poor: HPWL delta 204464.2755, avg displacement 3.721085, max displacement 118.790389."
      - "bp_quad_nangate45 was not run, so R4 cannot be promoted."
  r5_stage1_quality_guard:
    status: rejected_as_base
    result_note: "family_robustness/legalm_engine/NEXT_ALGORITHM_DIRECTION_20260425.md"
    patch_artifact: "family_variants/legalm_engine/research_patches/legalm_stage1_quality_guard_r5.patch"
    observation:
      - "R5 keeps R4 legality and adds Stage1 objective-aware candidate ordering."
      - "jpeg_nangate45 HPWL improves only 2.22% versus R4."
      - "jpeg_nangate45 average and max displacement both worsen versus R4."
      - "jpeg_nangate45 remains far behind clean evolve baseline quality."
  fallback_gate:
    status: diagnostic_only
    result_summary: "large_design_fallback_gate_20260425"
    observation:
      - "large_design_diamond_fallback results are not LEGALM success."
      - "bp_quad_nangate45 timed out at 360 seconds in the first fallback gate."
      - "A longer bp_quad retry produced metrics, but it is still fallback evidence."
diagnosis:
  - "R4 fixed a correctness invariant, not the placement-quality model."
  - "R5 shows scalar Stage1 candidate scoring is too local and cannot undo greedy slot consumption."
  - "JPEG and BP need Stage1 capacity reservation before individual cells consume nearby legal slots."
  - "The next solution must reduce displacement tails while preserving bounded complexity."
next_algorithm_direction:
  id: legalm_r6_row_segment_batch_assignment
  summary: >
    Replace greedy Stage1 placement with bounded per-plate row-segment
    reservation and batch assignment. Generate capped legal slot frontiers per
    cell, solve local min-cost assignments in capped buckets, and feed only
    unresolved overflow/high-cost outliers to Stage2 and Stage3.
  required_mechanisms:
    - "per-plate row free-interval index"
    - "height/row-band/component/net-anchor buckets with capped size"
    - "per-cell bounded candidate frontier"
    - "displacement outlier penalty and low-fanout HPWL proxy"
    - "local min-cost assignment or auction per bucket"
    - "Stage2/Stage3 hot frontier only"
  forbidden_mechanisms:
    - "full-core Stage1 fallback search"
    - "diamondDPL or default OpenDP fallback as success"
    - "large-design route switch away from LEGALM"
    - "uncapped all-cells by all-slots matching"
next_gate:
  - "build/materialize legalm_r6_row_segment_batch_assignment"
  - "strict aes_nangate45 same entrypoint no fallback"
  - "strict jpeg_nangate45 same entrypoint no fallback"
  - "strict bp_quad_nangate45 same entrypoint no fallback"
  - "report runtime, RSS, HPWL delta, avg displacement, max displacement, timing proxy, placement violations"
  - "report Stage1 bucket/candidate/assignment telemetry and Stage2/Stage3 hotset telemetry"
