    note: >
      The 50-way composite matrix did not solve bp_quad. Treat bp_quad as a
      separate scale gate requiring row-bucket active sets, metrics timeout
      tuning, or legalizer-only diagnostics.

positive_patterns:
  - id: current_blend_history_trim_rowedge
    evidence_variants:
      - alg03_curble_hisruntri_rowedgpro
      - alg27_curble_hisruntri_rowedgpro
    mechanism:
      target_cost: current_blend
      congestion_cost: history_runtime_trim
      sort_policy: overuse_disp_width
      search_policy: row_edge_probe
      recovery_policy: stall_very_patient
      postopt_policy: none
    observed_scope:
      - aes_nangate45
      - ibex_nangate45
      - jpeg_nangate45
      - ariane133_nangate45
    recommendation: >
      Highest-confidence multicase seed. Future negotiation/net-aware workers
      should move toward this structure before trying broader escape or postopt.
  - id: soft_threshold_overflow_only_rowedge
    evidence_variants:
      - alg39_softhr_oveonl_rowedgpro
      - alg15_softhr_oveonl_rowedgpro
    mechanism:
      target_cost: soft_threshold
      congestion_cost: overflow_only
      sort_policy: overuse_disp_width
      search_policy: row_edge_probe
      recovery_policy: stall_very_patient
      postopt_policy: none
    observed_scope:
      - jpeg_nangate45
      - ariane133_nangate45
      - aes_nangate45
    recommendation: >
      Strong jpeg HPWL/runtime pattern. Treat as a quality-biased branch that
      still needs bp_quad-scale protection.

avoid_patterns:
  - id: aggressive_recovery_plus_greedy_postopt
    mechanisms:
      - recovery_policy:stall_fast
      - recovery_policy:stall_patient
      - postopt_policy:guarded_greedy
      - postopt_policy:guarded_swap_greedy
    evidence: >
      These combinations had 100% failure in the sampled composites, mostly
      placement_check_failed or timeout.
    guidance: >
      Do not use broad recovery plus greedy/swap postopt as a base. If postopt
      is needed, make it hotset-limited and transactional.
  - id: fragile_target_congestion_pairs
    mechanisms:
      - target_cost:l1_quad_excess
      - congestion_cost:history_sqrt
      - target_cost:row_guard
      - congestion_cost:capacity_slack
      - target_cost:width_weighted
      - congestion_cost:history_capped
      - target_cost:linf_barrier
      - congestion_cost:overflow_square
    evidence: >
      These objective/congestion pairs had near-total placement_check_failed
      rates in the matrix.
    guidance: >
      Avoid using them as first-order base-family changes. Revisit only with
      stronger legality guards and smaller scoped experiments.
  - id: broad_home_or_spatial_sweep
    mechanisms:
      - sort_policy:spatial_sweep
      - search_policy:home_probe
    evidence: >
      High failure and timeout rate. These policies did not provide reliable
      broad-case benefit.
    guidance: >
      Prefer row_edge_probe or bounded midpoint/anchor probes over broad home
      or spatial sweeps.

worker_guidance:
  negotiation_scale:
    prefer:
      - current_blend_history_trim_rowedge
      - component_local_active_sets
      - row_bucket_candidate_indexes
    avoid:
      - aggressive_recovery_plus_greedy_postopt
      - broad fallback behavior
  netaware_objective:
    prefer:
      - current_blend_history_trim_rowedge
      - soft_threshold_overflow_only_rowedge
      - endpoint/fanout caps layered on row_edge_probe
    avoid:
      - constant-only tuning
      - fragile_target_congestion_pairs
  localized_swap:
    prefer:
      - no_postopt as the default unless legal stable parent exists
      - hotset-limited transactional polish
    avoid:
      - guarded_swap_greedy-style broad enumeration
  priority_escape:
    prefer:
      - rare escape only for no-valid/stuck cells
      - stall_very_patient-style conservative activation
    avoid:
      - stall_fast or stall_patient broad activation
      - escape that worsens HPWL/runtime on normal aes/jpeg
  legalm_engine:
    prefer:
      - conservative local candidate validity and displacement guards
      - bp_quad-scale bounded search from the start
    avoid:
      - using this matrix as LEGALM proof, because it covered negotiation
        composites only

quality_gate:
  promote_only_if:
    - legal placement
    - metrics present
    - hpwl_delta_micron not materially worse than same-run baseline
    - runtime_seconds not materially worse than same-run baseline
    - displacement outliers controlled
  reject_or_repair_if:
    - hpwl worsens by more than about 2 percent without a clear timing benefit
    - runtime worsens by more than about 25 percent without solving a hard failure
    - placement_check_failed appears on small/medium cases
    - bp_quad only passes through fallback or does not produce metrics
