schema_version: 1
source_experiment:
  id: matrix_algobank50_nangate45_20260424
  summary_json: local_archive_not_committed
  cases:
    - aes_nangate45
    - ibex_nangate45
    - jpeg_nangate45
    - ariane133_nangate45
    - bp_quad_nangate45
  variants: 50
  eval_records: 250
  note: >
    This matrix explored composite algorithmic changes inside dpl_evolve
    negotiation. It is evidence for future family routing, not a final
    optimized family by itself.

