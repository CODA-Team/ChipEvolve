id: runtime_regress
category: performance
trigger_signals:
  - runtime_pct_regression_above_guard
  - iteration_count_spike
  - strict track timeout
likely_root_causes:
  - larger search region
  - extra full-pass refinement
  - disabled skip/isolation logic
  - expensive debug logging left enabled
first_checks:
  - compare iteration counts and timing breakdowns
  - inspect whether postopt or restart loops increased
  - inspect if search enumeration widened
allowed_remediation:
  - reintroduce gating
  - narrow candidate enumeration
  - move debug logging behind a flag
forbidden_quick_fixes:
  - reduce runtime by skipping required legality/metrics checks
success_criteria:
  - runtime within guard while primary objective remains competitive
packet_hints:
  focus:
    - legalm_to_openroad
    - nblg_to_openroad
    - mutation_contract
