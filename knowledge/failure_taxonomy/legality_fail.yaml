id: legality_fail
category: algorithmic
trigger_signals:
  - metrics.legality=false
  - check_placement_failure
  - overlap_count_nonzero
likely_root_causes:
  - cost change underweights overflow elimination
  - search window allows unsafe moves
  - postopt violates overlap-free assumption
  - region/alignment invariant broken
first_checks:
  - inspect invariant cards
  - diff only legality-relevant logic
  - rerun strict track before full suite
allowed_remediation:
  - tighten overflow penalty
  - gate postopt
  - restore safer search policy
forbidden_quick_fixes:
  - disable legality checks
  - accept results with partial legality
success_criteria:
  - legality true
  - no new alignment/region regression
packet_hints:
  focus:
    - invariant_cards
    - delta_ledger
    - replay_bank
