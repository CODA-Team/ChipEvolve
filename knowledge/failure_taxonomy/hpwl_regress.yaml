id: hpwl_regress
category: objective
trigger_signals:
  - hpwl_proxy_regression
  - legalization_delta_hpwl_positive_above_threshold
likely_root_causes:
  - displacement-only cost overwhelms wirelength preservation
  - search order pushes cells too far from GP anchor
  - refinement/postopt disabled or ineffective
first_checks:
  - compare before/after displacement distribution
  - inspect target cost family and max-displacement weighting
  - inspect whether postopt stage is active
allowed_remediation:
  - rebalance target cost
  - add/adjust bounded refinement
  - tune search window / order
forbidden_quick_fixes:
  - use mirroring/DPO results as legalizer-only evidence in strict track
success_criteria:
  - hpwl_proxy improves or regresses within allowed tolerance while legality preserved
packet_hints:
  focus:
    - nblg_to_openroad
    - legalm_to_openroad
    - mutation_playbooks
