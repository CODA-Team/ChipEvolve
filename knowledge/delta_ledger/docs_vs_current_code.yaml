subject: "Public DPL docs vs public master command/code signals"
source_basis:
  docs: "OpenROAD/src/dpl/README.md public master"
  tcl: "OpenROAD/src/dpl/src/Opendp.tcl public master"
  flow: "OpenROAD-flow-scripts/flow/scripts/detail_place.tcl public master"
  code: "OpenROAD/src/dpl/src/NegotiationLegalizer.cpp public master"
facts:
  docs_pipeline:
    documented_negotiation_pipeline:
      - "Abacus pass"
      - "Negotiation pass"
      - "Post-optimisation: greedyImprove(5), cellSwap(), greedyImprove(1)"
    documented_limitations:
      - "Abacus cluster chain simplified"
      - "Negotiation pass single-threaded"
      - "Fence region nearestRect should use spatial index"
      - "Row rail inference still proxy-like"
  public_tcl_surface:
    detailed_placement_has_flags:
      - "-use_negotiation"
      - "-abacus"
      - "-incremental"
      - "-max_displacement"
    improve_placement_has_flags:
      - "-global_swap_args"
      - "-enable_extra_dpl"
  public_flow_stage:
    detail_place_includes:
      - "optional balance_row_usage"
      - "set_placement_padding"
      - "detailed_placement"
      - "optional improve_placement"
      - "optimize_mirroring"
      - "check_placement"
      - "estimate_parasitics -placement"
  public_code_signal:
    negotiation_postopt_calls:
      - "// greedyImprove(5);"
      - "// cellSwap();"
      - "// greedyImprove(1);"
    interpretation: "Visible in public master as commented-out calls."
implications_for_codex:
  - "Strict legalizer experiments must keep DPO and mirroring out of the measurement path."
  - "Reactivating or redesigning post-negotiation refinement is a plausible mutation family."
  - "Do not assume doc-described postopt is fully active in current code without checking local source."
local_repo_verification_required:
  - "verify your local sidecar still matches public master assumptions"
  - "if local differs, refresh this ledger first"
